name: Kinetics checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  kinetics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run kinetics and persistence checks
        run: dotnet run --project tests/Kinetics.Checks.csproj --configuration Release
